<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Rental Deal Analyzer</title>
<style>
  :root{
    --ink:#14181F; --paper:#FBFAF7; --panel:#FFFFFF; --line:#E7E3DA; --muted:#726C5F; --faint:#9A9384;
    --go:#1F7A4D; --goSoft:#E8F1EB; --bad:#B23A2E; --badSoft:#F7EAE7; --warn:#9A6B12; --warnSoft:#F6EEDC; --inputBg:#FCFBF8;
    --mono:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif; /* numbers: tabular sans */
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;padding:20px 16px 48px;}
  .wrap{max-width:1100px;margin:0 auto;}
  h1{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;}
  .seg{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:860px){.grid{grid-template-columns:minmax(0,1fr) 380px;align-items:start;}.results{position:sticky;top:16px;}}
  input,select{font-family:var(--sans);}
  .in{width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);background:var(--inputBg);border:1px solid var(--line);
    border-radius:7px;padding:8px 10px;text-align:right;outline:none;transition:border-color .15s,box-shadow .15s;}
  .in:focus{border-color:var(--go);box-shadow:0 0 0 3px var(--goSoft);}
  .in.text{text-align:left;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;}
  .lab{font-size:13px;color:var(--muted);}
  .out{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tab{font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600;}
  .fieldwrap{position:relative;width:130px;}
  .aff{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;color:var(--faint);}
  table{border-collapse:collapse;width:100%;min-width:460px;}
  @media(max-width:600px){
    body{padding:12px 10px 48px;}
    h1{font-size:20px;}
    .card{padding:12px 14px;}
    .in{font-size:16px;padding:10px;}
    .chip{padding:8px 12px;font-size:13px;}
    .tab{padding:9px 14px;}
    .fieldwrap{width:120px;}
  }
  input[type=number]{-moz-appearance:textfield;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
/* ===== v1.4 FX theme (Fintech Dark) ===== */
  @keyframes fxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fxGlow{0%,100%{box-shadow:0 0 0 1px rgba(52,245,181,.18),0 10px 40px rgba(34,211,165,.10)}50%{box-shadow:0 0 0 1px rgba(52,245,181,.30),0 10px 50px rgba(34,211,165,.20)}}
  @keyframes fxDraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .fx-enter .card,.fx-enter .fx-hero{animation:fxIn .45s cubic-bezier(.2,.7,.2,1) both}
  .fx-enter .col>*:nth-child(2),.fx-enter .results>*:nth-child(2){animation-delay:.06s}
  .fx-enter .col>*:nth-child(3),.fx-enter .results>*:nth-child(3){animation-delay:.12s}
  .fx-enter .col>*:nth-child(n+4),.fx-enter .results>*:nth-child(n+4){animation-delay:.18s}
  .card,.tab,.chip{transition:transform .18s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease}
  .tab{display:inline-flex;align-items:center;gap:7px}
  .tab .fx-ic{width:15px;height:15px;flex:none;opacity:.85}
  .tab{padding:7px 12px}
  #darkBtn{font-size:0;gap:0;padding:7px 9px}#darkBtn .fx-ic{width:16px;height:16px}
  @media(max-width:600px){.tab{padding:9px 12px}}
  .tab:hover,.chip:hover{transform:translateY(-1px)}
  .fx-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#22d3a5,#3b82f6);display:grid;place-items:center;box-shadow:0 0 22px rgba(34,211,165,.35);flex:none}
  .fx-hero{position:relative;overflow:hidden;border-radius:18px;padding:20px 20px 18px;color:#E6EDF6;
    background:radial-gradient(420px 220px at 100% 0%,rgba(59,130,246,.22),transparent 60%),radial-gradient(360px 200px at 0% 100%,rgba(34,211,165,.16),transparent 60%),linear-gradient(160deg,#101b2e,#0a111e);
    border:1px solid rgba(255,255,255,.10);animation:fxGlow 5s ease-in-out infinite}
  .fx-gauge .arc{animation:fxDraw 1s cubic-bezier(.2,.7,.2,1) both}
  .fx-big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  html.fx-dark body{background:radial-gradient(1200px 640px at 85% -8%,#18365a 0%,rgba(10,15,26,0) 60%),radial-gradient(900px 500px at -10% 30%,rgba(34,211,165,.07),rgba(10,15,26,0) 60%),#0A0F1A !important;background-attachment:fixed !important}
  html.fx-dark .card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02)),rgba(17,26,42,.55);border-color:rgba(255,255,255,.09);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
  html.fx-dark .card:hover{border-color:rgba(52,245,181,.22)}
  html.fx-dark .tab,html.fx-dark .chip{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.10);color:#9FB2C8}
  html.fx-dark .tab:hover,html.fx-dark .chip:hover{border-color:rgba(52,245,181,.35);color:#E6EDF6}
  html.fx-dark .tab.active,html.fx-dark .chip.active{background:linear-gradient(135deg,#22d3a5,#3b82f6);color:#04121d;border-color:transparent;box-shadow:0 6px 22px rgba(34,211,165,.28)}
  html.fx-dark .in,html.fx-dark select{background:rgba(8,14,26,.7) !important;border-color:rgba(255,255,255,.10) !important;color:#E6EDF6 !important}
  html.fx-dark .in:focus{border-color:#34F5B5 !important;box-shadow:0 0 0 3px rgba(52,245,181,.15)}
  html.fx-dark h1{background:linear-gradient(90deg,#fff,#b9d3ef);-webkit-background-clip:text;background-clip:text;color:transparent}
  html.fx-dark .fx-pos{color:#34F5B5;text-shadow:0 0 26px rgba(52,245,181,.45)}
  html.fx-dark .fx-neg{color:#FF6B81;text-shadow:0 0 26px rgba(255,107,129,.40)}
  html.fx-dark table tr:hover td{background:rgba(52,245,181,.04)}
  html:not(.fx-dark) .fx-pos{color:#5FC98C}html:not(.fx-dark) .fx-neg{color:#F08A7E}
  html.fx-dark #mgtP{background:rgba(255,107,129,.10)!important;color:#FF6B81!important}
  html.fx-dark #mgtW{background:rgba(251,191,36,.10)!important;color:#FBBF24!important}
  html.fx-dark #mgtF{background:rgba(96,165,250,.12)!important;color:#7CB8FF!important}
  html.fx-dark #mgtB{background:rgba(52,245,181,.10)!important;color:#34F5B5!important}
  #mgPct{text-shadow:0 0 14px currentColor}
  /* v1.4 comparison + end game */
  .cmp-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .cmp-card{padding:16px}
  .cmp-top{border-color:rgba(251,191,36,.45)!important;box-shadow:0 0 0 1px rgba(251,191,36,.25),0 12px 36px rgba(251,191,36,.10)!important}
  .cmp-rank{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 7px;border-radius:999px;font-weight:800;font-size:12px;border:1px solid}
  .cmp-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:13px}
  .cmp-bar-lab{width:210px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmp-tbl{min-width:0}
  .cmp-tbl th{padding:12px 14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);vertical-align:bottom}
  .cmp-tbl td{padding:10px 14px;font-size:13px;border-top:1px solid var(--line)}
  .cmp-sticky{position:sticky;left:0;z-index:1;background:var(--panel);color:var(--muted);text-align:left;white-space:nowrap}
  .cmp-best{background:var(--goSoft)}
  .eg-hero{display:flex;gap:28px;align-items:center;padding:24px 26px;flex-wrap:wrap}
  .eg-ring{flex:none;margin:0 auto}
  .eg-stats{flex:1;min-width:260px}
  .eg-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .eg-kpis>div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
  .eg-k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#7F95AD;margin-bottom:3px}
  .eg-stack{display:flex;height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;gap:2px}
  .eg-stack>div{height:100%;transition:width .6s ease}
  .eg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}
  .eg-wide{grid-column:1/-1}
  .eg-prop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
  .eg-prop.off{opacity:.45}
  .eg-inc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
  .eg-dot{width:10px;height:10px;border-radius:3px;flex:none}
  @media(max-width:860px){.eg-grid{grid-template-columns:1fr}.eg-kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){
    .tabrow{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:6px;margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px;scrollbar-width:none}
    .tabrow::-webkit-scrollbar{display:none}
    .tabrow .tab{flex:none;white-space:nowrap}
    .fx-right{align-items:flex-start!important;width:100%}
    .cmp-bar-lab{width:100px}
    .eg-hero{padding:18px}
  }
  /* v1.4 team priority */
  .tm-row{display:flex;gap:12px;align-items:stretch;padding:10px 0;border-top:1px solid var(--line);transition:background .15s,opacity .15s}
  .tm-row-first{background:linear-gradient(90deg,rgba(251,191,36,.07),transparent 60%)}
  .tm-rail{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
  .tm-handle{cursor:grab;color:var(--faint);font-size:14px;letter-spacing:-2px;line-height:1;padding:2px 6px;border-radius:6px;user-select:none}
  .tm-handle:hover{color:var(--ink);background:rgba(128,128,128,.12)}
  .tm-rank{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid var(--line);color:var(--muted)}
  .tm-first{background:#FBBF24;border-color:#FBBF24;color:#0A0F1A;box-shadow:0 0 14px rgba(251,191,36,.45)}
  .tm-lab{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;line-height:1.2}
  .tm-row-first .tm-lab{color:#E0A800}
  html.fx-dark .tm-row-first .tm-lab{color:#FBBF24}
  .tm-arrows{display:flex;gap:3px;margin-top:2px}
  .tm-mv{padding:2px 6px!important;font-size:9px!important;line-height:1.3}
  .tm-mv[disabled]{opacity:.3;cursor:default;transform:none!important}
  .tm-dragging{opacity:.4}
  .tm-over{background:rgba(52,245,181,.08);box-shadow:inset 0 2px 0 #34F5B5}
  @media(max-width:600px){.tm-rail{width:50px}.tm-handle{display:none}.tm-mv{padding:5px 8px!important;font-size:11px!important}.tm-arrows{flex-direction:column}}
  /* v1.5 BRRRR console */
  .brr-hero{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;padding:22px 24px}
  .brr-name{background:transparent!important;border:none!important;border-bottom:1px solid rgba(255,255,255,.18)!important;border-radius:0!important;color:#E6EDF6!important;font-weight:600;padding:5px 2px!important;text-align:left}
  .brr-name:focus{border-bottom-color:#34F5B5!important;box-shadow:none!important}
  .brr-bar{position:relative;height:34px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);overflow:hidden;margin-top:6px}
  .brr-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:100px 0 0 100px;transition:width .45s cubic-bezier(.4,0,.2,1),background .3s}
  .brr-barlab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .brr-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
  .brr-kpi{padding:14px 15px}
  .brr-klab{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .brr-kval{font-size:20px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .brr-ksub{font-size:11px;color:var(--faint);margin-top:3px}
  .brr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}
  .brr-sub{font-size:12.5px;color:var(--muted);margin:6px 0 14px;line-height:1.5}
  .brr-fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .brr-f{background:var(--inputBg);border:1px solid var(--line);border-radius:10px;padding:8px 11px 7px;transition:border-color .15s,opacity .15s}
  .brr-f:focus-within{border-color:#34F5B5}
  .brr-f.dim{opacity:.45}
  .brr-f label{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
  .brr-in{display:flex;align-items:baseline;gap:5px}
  .brr-in .in{background:transparent!important;border:none!important;border-radius:0!important;padding:0!important;text-align:left;font-size:14.5px;font-weight:600;box-shadow:none!important}
  .brr-aff{color:var(--faint);font-size:12.5px;white-space:nowrap}
  .brr-hint{margin-top:3px;font-size:10px;color:var(--faint)}
  .brr-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--muted)}
  .brr-row .out{font-weight:600;color:var(--ink);white-space:nowrap}
  .brr-row.tot{border-bottom:none;border-top:1px solid var(--line);margin-top:6px;padding-top:11px}
  .brr-row.tot span:first-child{color:var(--ink);font-weight:700;font-size:13.5px}
  .brr-row.tot .out{font-size:16px;font-weight:800}
  @media(max-width:1100px){.brr-kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:900px){.brr-grid{grid-template-columns:1fr}}
  @media(max-width:700px){.brr-scale span:nth-child(2){display:none}}
  @media(max-width:560px){.brr-kpis{grid-template-columns:repeat(2,1fr)}.brr-fg{grid-template-columns:1fr}.brr-hero{padding:18px}}
  /* v1.5 neon energy bar (BRRRR + Margin) */
  @keyframes nrgPulse{0%,100%{filter:saturate(1.02) brightness(1)}50%{filter:saturate(1.12) brightness(1.06)}}
  .nrg-bar{position:relative;height:30px;border-radius:100px;background:rgba(2,6,14,.55);
    border:1.5px solid rgba(255,255,255,.16);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05);overflow:visible}
  .nrg-fill{position:absolute;left:4px;top:4px;bottom:4px;width:0;border-radius:100px;
    background:linear-gradient(90deg,var(--zcd,#1f6e4c) 0%,var(--zc,#34F5B5) 58%,color-mix(in srgb,var(--zc,#34F5B5) 55%,#fff) 100%);
    box-shadow:0 0 4px var(--zcg,rgba(52,245,181,.35)),0 0 11px var(--zcg,rgba(52,245,181,.35)),0 0 22px var(--zcg,rgba(52,245,181,.35)),inset 0 0 6px rgba(255,255,255,.28);
    transition:width .5s cubic-bezier(.4,0,.2,1),background .3s,box-shadow .3s;animation:nrgPulse 3.2s ease-in-out infinite}
  .nrg-fill::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,var(--zc,#34F5B5) 45%,transparent 72%);filter:blur(2px);opacity:.5}
  .nrg-fill::before{content:"";position:absolute;left:6px;right:8px;top:2px;height:32%;border-radius:100px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
  .nrg-lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;
    font-size:11.5px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6)}
  .nrg-scale{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#7F95AD;margin-top:7px}
  .brr-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  /* contractor row: notes takes the leftover width */
  .con-row{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr)) 1.8fr auto;gap:10px;align-items:start}
  .alist-row{grid-template-columns:repeat(5,minmax(110px,1fr)) 1.5fr auto}
  @media(max-width:1200px){.alist-row{grid-template-columns:repeat(3,minmax(130px,1fr)) auto}}
  @media(max-width:1000px){.con-row{grid-template-columns:repeat(2,minmax(140px,1fr))}.con-notes{grid-column:1/-1}}
  @media(max-width:600px){.con-row{grid-template-columns:1fr}.con-notes{grid-column:auto}}
  @media (prefers-reduced-motion:reduce){.nrg-fill{animation:none}}
  @media(max-width:700px){.nrg-scale span:nth-child(2){display:none}}
  @media (prefers-reduced-motion:reduce){.fx-enter .card,.fx-enter .fx-hero,.fx-hero,.fx-gauge .arc{animation:none}}
</style>

<script>
var _memStore={};
var store={

  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){_memStore[k]=v;}}
};
var _storageOk=(function(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true;}catch(e){return false;}})();
var C={ink:"#14181F",paper:"#FBFAF7",panel:"#FFFFFF",line:"#E7E3DA",muted:"#726C5F",faint:"#9A9384",
  go:"#1F7A4D",goSoft:"#E8F1EB",bad:"#B23A2E",badSoft:"#F7EAE7",warn:"#9A6B12",warnSoft:"#F6EEDC",inputBg:"#FCFBF8"};

  closingPct:2.5,rehab:10000,aduBuildCost:0,unitCount:1,units:[3400,0,0,0,0,0],aduOn:false,aduRent:0,
  otherIncome:0,vacPct:5,taxPct:1.2,insurance:1500,hoa:0,pmPct:0,maintPct:1,utilities:0,opexOverride:0,upside:"none",condition:"light",apprPct:3,schoolRating:7,homeSqft:1180,lotSqft:8250,unitBeds:[0,0,0,0,0,0],unitBaths:[0,0,0,0,0,0]};

function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
/* v1.6 grading helpers */
function scoreCoC(c){if(c>=10)return 10;if(c>=8)return 9;if(c>=6)return 7.5;if(c>=4)return 6;if(c>=2)return 4;if(c>=0)return 2.5;if(c>=-2)return 1;return 0;}
function scoreCFDoor(v){if(v>=500)return 10;if(v>=350)return 8.5;if(v>=200)return 7;if(v>=100)return 5.5;if(v>=0)return 4;if(v>=-150)return 2;if(v>=-400)return 1;return 0;}
function scoreYield(y){return clamp((y-3.5)/3.5*10,0,10);}
var UPSIDE_S={none:{s:3,label:"No obvious upside"},possible:{s:7,label:"ADU / added unit possible"},strong:{s:10,label:"ADU + lot split or big rent upside"}};
var COND_S={turnkey:{s:9.5,label:"Turnkey"},light:{s:8,label:"Light cosmetic"},heavy:{s:5,label:"Heavy rehab"},problem:{s:3,label:"Tenants in place / permit issues"}};
function money(n){return (n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString();}
function pct(n){return n.toFixed(1)+"%";}
function mult(n){return n.toFixed(2)+"x";}
function uid(){return Math.random().toString(36).slice(2,9);}
function normalize(d){var o=Object.assign({},DEFAULT_DEAL,d||{});var u=(d&&d.units)?d.units.slice():DEFAULT_DEAL.units.slice();while(u.length<6)u.push(0);o.units=u.slice(0,6);var pad=function(a){a=(a&&a.slice)?a.slice():[];while(a.length<6)a.push(0);return a.slice(0,6);};o.unitBeds=pad(d&&d.unitBeds);o.unitBaths=pad(d&&d.unitBaths);return o;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function gradeMeta(g){
  if(g>=8.5)return{word:"Exceptional",color:C.go,soft:C.goSoft,hi:GREEN_H};
  if(g>=7)return{word:"Strong",color:C.go,soft:C.goSoft,hi:GREEN_H};
  if(g>=5.5)return{word:"Solid",color:C.warn,soft:C.warnSoft,hi:AMBER_H};
  if(g>=4)return{word:"Marginal",color:C.warn,soft:C.warnSoft,hi:AMBER_H};
  if(g>=2.5)return{word:"Weak",color:C.bad,soft:C.badSoft,hi:RED_H};
  return{word:"Poor",color:C.bad,soft:C.badSoft,hi:RED_H};
}

function compute(d){
  var price=num(d.price),dp=num(d.dpPct)/100,r=num(d.rate)/100/12,n=num(d.termYears)*12;
  var down=price*dp,loan=price-down,pi=0;
  if(loan>0&&n>0)pi=r===0?loan/n:(loan*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
  var closing=price*(num(d.closingPct)/100);
  var aduBuild=d.aduOn?num(d.aduBuildCost):0;
  var cashToClose=down+closing+num(d.rehab)+aduBuild;
  var unitRent=0;for(var i=0;i<d.unitCount;i++)unitRent+=num(d.units[i]);
  var aduRent=d.aduOn?num(d.aduRent):0;
  var grossMo=unitRent+aduRent+num(d.otherIncome);
  var grossYr=grossMo*12,vac=num(d.vacPct)/100,egi=grossYr*(1-vac);
  var occUnits=0;for(var j=0;j<d.unitCount;j++)if(num(d.units[j])>0)occUnits++;if(aduRent>0)occUnits++;
  var taxes=price*(num(d.taxPct)/100),pm=grossYr*(num(d.pmPct)/100),maint=price*(num(d.maintPct)/100);
  var opexOv=num(d.opexOverride);
  var opexParts=taxes+num(d.insurance)+num(d.hoa)+pm+maint+num(d.utilities);
  var opex=opexOv>0?opexOv:opexParts;
  var noi=egi-opex,ds=pi*12,acf=noi-ds,mcf=acf/12;
  var cap=price>0?noi/price*100:0,coc=cashToClose>0?acf/cashToClose*100:0,grm=grossYr>0?price/grossYr:0,dscr=ds>0?noi/ds:0;
  var breakevenOcc=grossYr>0?(opex+ds)/grossYr*100:0;
  var pmPct=num(d.pmPct)/100,maintPct=num(d.maintPct)/100,taxPct=num(d.taxPct)/100;
  var k=(loan>0&&pi>0)?pi/loan:(r===0&&n>0?1/n:0);
  var fixedNonPrice=num(d.insurance)+num(d.hoa)+num(d.utilities);
  var denom=taxPct+maintPct+(1-dp)*k*12;
  var maxPrice=denom>0?(egi-fixedNonPrice-grossYr*pmPct)/denom:0;
  var fixedOpex=opexOv>0?opexOv:(taxes+num(d.insurance)+num(d.hoa)+maint+num(d.utilities));
  var denom2=opexOv>0?(1-vac):(1-vac-pmPct);
  var beGrossYr=denom2>0?(ds+fixedOpex)/denom2:0;
  var beRentMo=beGrossYr/12;
  var cfPerUnit=mcf/Math.max(occUnits,1),appr=num(d.apprPct),school=num(d.schoolRating);
  var homeSqft=num(d.homeSqft),lotSqft=num(d.lotSqft);
  var ppsf=homeSqft>0?price/homeSqft:0;
  var sfHomePerK=(homeSqft>0&&price>0)?homeSqft/(price/1000):0;
  var sfLotPerK=(lotSqft>0&&price>0)?lotSqft/(price/1000):0;
  var doors=Math.max(1,num(d.unitCount)+(d.aduOn&&aduRent>0?1:0));
  var cfDoor=mcf/doors,grossYield=price>0?grossYr/price*100:0;
  var loanConst=loan>0?pi*12/loan*100:0;
  var up=UPSIDE_S[d.upside]||UPSIDE_S.none,cond=COND_S[d.condition]||COND_S.light;
  var factors=[
    {key:"Cash-on-cash return",w:.25,s:scoreCoC(coc),detail:pct(coc)},
    {key:"Cash flow per door",w:.20,s:scoreCFDoor(cfDoor),detail:money(cfDoor)+"/mo"},
    {key:"Debt safety (DSCR)",w:.20,s:scoreDSCR(dscr),detail:mult(dscr)},
    {key:"Rent-to-price (gross yield)",w:.15,s:scoreYield(grossYield),detail:pct(grossYield)},
    {key:"Upside & optionality",w:.10,s:up.s,detail:up.label},
    {key:"Condition & risk",w:.05,s:cond.s,detail:cond.label},
    {key:"Schools & area",w:.05,s:clamp(school,0,10),detail:school.toFixed(0)+"/10"}
  ];
  var grade=0;for(var f=0;f<factors.length;f++)grade+=factors[f].w*factors[f].s;
  var gates=[];
  if(loan>0&&cap<loanConst){var gap=loanConst-cap;gates.push({cap:gap>2?5:6.5,why:"Negative leverage — cap rate "+pct(cap)+" is below the loan constant "+pct(loanConst)+" (debt costs more than the property earns)."});}
  if(ds>0&&dscr<1){gates.push({cap:4,why:"DSCR below 1.00 — the property does not cover its own debt."});}
  if(breakevenOcc>95){gates.push({cap:4,why:"Break-even occupancy above 95% — no room for a vacancy."});}
  gates.forEach(function(g){if(grade>g.cap)grade=g.cap;});
  var gm=gradeMeta(grade);
  var verdict,vColor,vSoft,vNote;
  if(coc>=8){verdict="STRONG";vColor=C.go;vSoft=C.goSoft;vNote="Meets cash-on-cash and cash-flow targets.";}
  else if(mcf>=0&&coc>=4){verdict="MARGINAL";vColor=C.warn;vSoft=C.warnSoft;vNote="Positive cash flow but return below an 8% target.";}
  else if(mcf>=0){verdict="THIN";vColor=C.warn;vSoft=C.warnSoft;vNote="Barely positive - verify rents and expenses carefully.";}
  else{verdict="PASS";vColor=C.bad;vSoft=C.badSoft;vNote="Negative cash flow at these inputs.";}
  return{down:down,loan:loan,pi:pi,cashToClose:cashToClose,grossMo:grossMo,egi:egi,occUnits:occUnits,
    taxes:taxes,maint:maint,opex:opex,noi:noi,acf:acf,mcf:mcf,cap:cap,coc:coc,grm:grm,dscr:dscr,
    breakevenOcc:breakevenOcc,maxPrice:maxPrice,beRentMo:beRentMo,verdict:verdict,vColor:vColor,vSoft:vSoft,
    vNote:vNote,grade:grade,gm:gm,factors:factors,school:school,gates:gates,cfDoor:cfDoor,grossYield:grossYield,loanConst:loanConst,doors:doors,opexOv:opexOv};
}

var deals=[],currentId=null,view="analyze",showBreak=true,deal=null;

function load(){
  try{var r=store.get("rda_deals");if(r){deals=JSON.parse(r).map(function(x){return{id:x.id,name:x.name,deal:normalize(x.deal)};});}}catch(e){deals=[];}
  if(!deals.length){var id=uid();deals=[{id:id,name:"San Gabriel - El Monte St",deal:normalize(DEFAULT_DEAL)}];currentId=id;}
  else{try{var lo=store.get("rda_lastOpen");currentId=(lo&&deals.some(function(x){return x.id===lo;}))?lo:deals[0].id;}catch(e){currentId=deals[0].id;}}
  deal=deals.find(function(x){return x.id===currentId;}).deal;
}
function save(){try{store.set("rda_deals",JSON.stringify(deals));store.set("rda_lastOpen",currentId);}catch(e){}}
function currentName(){var e=deals.find(function(x){return x.id===currentId;});return e?e.name:"";}

function field(label,key,opt){opt=opt||{};var v=key.indexOf("unit")===0?deal.units[+key.slice(4)]:deal[key];
  return '<div class="row"><label class="lab" style="flex:1">'+label+'</label><div class="fieldwrap">'+
    (opt.prefix?'<span class="aff" style="left:9px">'+opt.prefix+'</span>':'')+
    '<input class="in" inputmode="decimal" data-key="'+key+'" step="'+(opt.step||"1")+'" value="'+esc(v)+'" '+
    'style="padding-left:'+(opt.prefix?20:10)+'px;padding-right:'+(opt.suffix?26:10)+'px"/>'+
    (opt.suffix?'<span class="aff" style="right:9px">'+opt.suffix+'</span>':'')+'</div></div>';}
function selField(label,key,opts){
  return '<div class="row"><label class="lab" style="flex:1">'+label+'</label>'+
    '<select class="in text" data-skey="'+key+'" style="width:220px;max-width:55%">'+
    opts.map(function(o){return '<option value="'+o[0]+'"'+(deal[key]===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';}
function outRow(label,id,strong){return '<div class="row" style="border-top:1px dashed '+C.line+'">'+
  '<span class="lab" style="'+(strong?'font-weight:600;color:'+C.ink:'')+'">'+label+'</span>'+
  '<span class="out" id="'+id+'" style="font-size:'+(strong?15:13.5)+'px;font-weight:'+(strong?700:500)+'"></span></div>';}

      '<span style="color:'+C.muted+'">'+f.key+' <span style="color:'+C.faint+'">- '+Math.round(f.w*100)+'%</span></span>'+
      '<span class="out" style="color:'+C.ink+'">'+f.detail+' <span style="color:'+C.faint+'">('+f.s.toFixed(1)+')</span></span></div>'+
      '<div style="height:6px;background:'+C.line+';border-radius:999px;overflow:hidden"><div style="width:'+(f.s/10*100)+'%;height:100%;background:'+col+';border-radius:999px"></div></div></div>';}).join('')+
    '<p style="font-size:11px;color:'+C.faint+';margin:8px 0 0;line-height:1.5">Weighted 1-10 score: cash-on-cash 25%, cash flow per door 20%, debt safety 20%, rent-to-price 15%, upside 10%, condition 5%, schools 5%. Deal breakers (negative leverage, DSCR under 1.00, break-even occupancy over 95%) cap the grade no matter how the rest scores.</p></div>';}

  h+='<div class="card" style="margin-top:16px"><div class="seg">Monthly summary</div>'+

    metricRow("Monthly P&amp;I","-"+money(m.pi))+
    metricRow("Monthly operating expenses","-"+money(m.opex/12))+
    '<div class="row" style="border-top:1px solid '+C.line+';margin-top:4px">'+
    '<span class="lab" style="font-weight:600;color:'+C.ink+';font-size:14px">Net monthly cash flow</span>'+
    '<span class="out" style="font-size:18px;font-weight:700;color:'+(m.mcf>=0?C.go:C.bad)+'">'+money(m.mcf)+'</span></div>'+
    '<p style="font-size:11.5px;color:'+C.faint+';margin:8px 0 0;line-height:1.5">Effective monthly rent minus monthly P&amp;I and monthly operating expenses. Matches the cash flow shown above.</p></div>';
  h+='<p style="font-size:11.5px;color:'+C.faint+';margin:14px 0 0;line-height:1.5">Rents are estimates until verified against current comps. Screening tool only - confirm specifics with your lender and CPA.</p>';
  return h;
}
function metricRow(l,v,strong){return '<div class="row" style="border-top:1px dashed '+C.line+'"><span class="lab" style="'+(strong?'font-weight:600;color:'+C.ink:'')+'">'+l+'</span><span class="out" style="font-size:'+(strong?15:13.5)+'px;font-weight:'+(strong?700:500)+'">'+v+'</span></div>';}

function recompute(){
  var m=compute(deal);
  var map={out_down:money(m.down),out_loan:money(m.loan),out_pi:money(m.pi),out_cash:money(m.cashToClose),
    out_grossMo:money(m.grossMo),out_egi:money(m.egi),out_occ:String(m.occUnits),out_taxes:money(m.taxes),
    out_maint:money(m.maint),out_opex:money(m.opex),out_opexMo:money(m.opex/12)};
  for(var k in map){var el=document.getElementById(k);if(el)el.textContent=map[k];}
  var res=document.getElementById("results");if(res)res.innerHTML=resultsHTML(m);
  var bt=document.getElementById("breakToggle");if(bt)bt.onclick=function(){showBreak=!showBreak;recompute();};
}

  var rows=[
    {l:"Grade",g:function(m){return m.grade;},f:function(v){return v.toFixed(1)+" /10";},b:"high",bold:true},
    {l:"Verdict",g:function(m){return m.verdict;},f:function(v){return v;},b:null},
    {l:"Monthly cash flow",g:function(m){return m.mcf;},f:money,b:"high",bold:true},
    {l:"Cash-on-cash",g:function(m){return m.coc;},f:pct,b:"high"},
    {l:"Cap rate",g:function(m){return m.cap;},f:pct,b:"high"},
    {l:"DSCR",g:function(m){return m.dscr;},f:mult,b:"high"},
    {l:"GRM",g:function(m){return m.grm;},f:mult,b:"low"},

    {l:"NOI / yr",g:function(m){return m.noi;},f:money,b:"high"}
  ];
  function best(row){if(!row.b)return -1;var bi=0,bv=row.g(cols[0].m);for(var i=0;i<cols.length;i++){var v=row.g(cols[i].m);if(row.b==="high"?v>bv:v<bv){bv=v;bi=i;}}return bi;}
  var h='<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table><thead><tr>'+
    '<th style="text-align:left;padding:14px 16px;background:'+C.ink+';color:'+C.paper+';font-size:11px;letter-spacing:.1em;text-transform:uppercase;position:sticky;left:0;z-index:2">Metric</th>';

    '<button class="cmpOpen" data-id="'+c.id+'" style="margin-top:6px;font-size:11px;color:'+C.paper+';background:transparent;border:1px solid #3A3F48;border-radius:6px;padding:3px 8px;cursor:pointer">Open</button></th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(row,ri){var bi=best(row);h+='<tr style="border-top:1px solid '+C.line+';background:'+(ri%2?C.inputBg:C.panel)+'">'+
    '<td style="padding:10px 16px;font-size:12.5px;color:'+C.muted+';position:sticky;left:0;background:'+(ri%2?C.inputBg:C.panel)+';font-weight:'+(row.bold?600:400)+'">'+row.l+'</td>';
    cols.forEach(function(c,i){var v=row.g(c.m),isBest=i===bi,color=C.ink;
      if(row.l==="Monthly cash flow")color=v>=0?C.go:C.bad;if(row.l==="Verdict")color=c.m.vColor;
      h+='<td class="out" style="padding:10px 14px;text-align:right;font-size:'+(row.bold?14:13)+'px;font-weight:'+(row.bold||isBest?700:500)+';color:'+color+';background:'+(isBest?C.goSoft:"transparent")+'">'+row.f(v)+'</td>';});
    h+='</tr>';});
  h+='</tbody></table></div><p style="font-size:11.5px;color:'+C.faint+';margin:0;padding:10px 16px;line-height:1.5">Green = best in row. Higher is better except GRM, break-even occupancy, and cash to close. Grade weights cash flow and debt safety over appreciation.</p></div>';
  return h;

function mBetween(s){if(!s)return 0;var a=new Date(s),b=new Date();var m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());return Math.max(0,m);}
function balAfter(loan,r,n,pi,k){if(k<=0)return loan;if(k>=n)return 0;if(r===0)return Math.max(0,loan-pi*k);return loan*Math.pow(1+r,k)-pi*((Math.pow(1+r,k)-1)/r);}
function pCalc(p){
  var price=num(p.price),dp=num(p.dpPct)/100,r=num(p.rate)/100/12,n=num(p.termYears)*12;
  var loan=price*(1-dp),pi=(loan>0&&n>0)?(r===0?loan/n:loan*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)):0;
  var egi=num(p.rent)*12*(1-num(p.vacPct)/100);
  var taxesY=price*(num(p.taxPct)/100),mgmtMo=num(p.rent)*(num(p.pmPct)/100),maintMo=price*(num(p.maintPct)/100)/12;
  var otherMo=num(p.hoa)+mgmtMo+maintMo+num(p.utilities);
  var opex=(taxesY/12+num(p.insurance)/12+otherMo)*12;
  var pitiCalc=pi+taxesY/12+num(p.insurance)/12,piti=num(p.pitiOverride)>0?num(p.pitiOverride):pitiCalc;
  var mcf=egi/12-piti-otherMo,acf=mcf*12,noi=egi-opex,ds=pi*12;
  var cashInv=price*dp+price*(num(DEFAULTS.closingPct)/100);
  var cap=price>0?noi/price*100:0,coc=cashInv>0?acf/cashInv*100:0,dscr=ds>0?noi/ds:0;
  var made=Math.min(n,mBetween(p.loanStart||p.purchaseDate));
  var balNow=num(p.balOverride)>0?num(p.balOverride):balAfter(loan,r,n,pi,made);
  var equity=num(p.value)-balNow,paidOff=loan>0?(loan-balNow)/loan*100:0;
  return {loan:loan,pi:pi,piti:piti,noi:noi,acf:acf,mcf:mcf,cap:cap,coc:coc,dscr:dscr,equity:equity,balNow:balNow,paidOff:paidOff,cashInv:cashInv};
}

/* ---- inline SVG charts (no dependency) ---- */
function svgRevExp(props,res){
  if(!props.length)return "";
  var rows=props.map(function(p,i){var pm=num(p.rent)*(num(p.pmPct)/100),maint=num(p.price)*(num(p.maintPct)/100)/12,other=num(p.hoa)+pm+maint+num(p.utilities);
    return {name:p.name||"Property",rent:num(p.rent),piti:res[i].piti,other:other,cost:res[i].piti+other};});
  var max=Math.max(1,Math.max.apply(null,rows.map(function(r){return Math.max(r.rent,r.cost);})));
  var W=600,L=120,BW=380,rh=54,H=rows.length*rh+6,sc=function(v){return BW*v/max;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  rows.forEach(function(r,i){var y=i*rh+10;
    s+='<text x="0" y="'+(y+12)+'" font-size="12" fill="'+C.ink+'">'+esc(String(r.name).slice(0,16))+'</text>';
    s+='<rect x="'+L+'" y="'+y+'" width="'+sc(r.rent).toFixed(1)+'" height="14" rx="3" fill="'+C.go+'"/>';
    s+='<text x="'+(L+sc(r.rent)+6).toFixed(1)+'" y="'+(y+11)+'" font-size="10.5" fill="'+C.muted+'">'+money(r.rent)+'</text>';
    var y2=y+18;
    s+='<rect x="'+L+'" y="'+y2+'" width="'+sc(r.piti).toFixed(1)+'" height="14" rx="3" fill="'+C.bad+'"/>';
    s+='<rect x="'+(L+sc(r.piti)).toFixed(1)+'" y="'+y2+'" width="'+sc(r.other).toFixed(1)+'" height="14" fill="#E0A9A2"/>';
    s+='<text x="'+(L+sc(r.cost)+6).toFixed(1)+'" y="'+(y2+11)+'" font-size="10.5" fill="'+C.muted+'">'+money(r.cost)+'</text>';
  });
  s+='</svg>';
  return s+'<div style="display:flex;gap:14px;font-size:11px;color:'+C.muted+';margin-top:4px;flex-wrap:wrap">'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:'+C.go+';border-radius:2px"></span> Rent</span>'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:'+C.bad+';border-radius:2px"></span> PITI</span>'+
    '<span><span style="display:inline-block;width:10px;height:10px;background:#E0A9A2;border-radius:2px"></span> Other op ex</span></div>';
}
function svgCash(props,res){
  if(!props.length)return "";
  var vals=props.map(function(p,i){return {name:p.name||"Property",v:res[i].mcf};});
  var max=Math.max(1,Math.max.apply(null,vals.map(function(x){return Math.abs(x.v);})));
  var W=600,L=120,BW=360,rh=32,H=vals.length*rh+6;
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  vals.forEach(function(r,i){var y=i*rh+10;var w=BW*Math.abs(r.v)/max;var col=r.v<0?C.bad:C.go;
    s+='<text x="0" y="'+(y+13)+'" font-size="12" fill="'+C.ink+'">'+esc(String(r.name).slice(0,16))+'</text>';
    s+='<rect x="'+L+'" y="'+y+'" width="'+w.toFixed(1)+'" height="16" rx="3" fill="'+col+'"/>';
    s+='<text x="'+(L+w+6).toFixed(1)+'" y="'+(y+13)+'" font-size="10.5" fill="'+col+'">'+money(r.v)+'</text>';
  });
  s+='</svg>';return s;
}

function marginTier(m){

function recomputeMargin(){
  var g=function(id){var e=document.getElementById(id);return e?num(e.value):0;};
  var arv=g("mgArv"),pur=g("mgPur"),reh=g("mgReh"),clo=g("mgClo"),hol=g("mgHol"),sel=g("mgSel"),wf=g("mgWf");
  marginData={arv:arv,pur:pur,reh:reh,clo:clo,hol:hol,sel:sel,wf:wf};saveMargin();
  var allIn=pur+reh+clo+hol+sel,profit=arv-allIn,margin=arv>0?profit/arv*100:0,mao=0.70*arv-reh;
  var t=marginTier(margin);
  var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};
  set("mgAllin",money(allIn));set("mgProfit",money(profit));set("mgMao",money(mao));set("mgWfout",wf>0?money(wf):"—");
  var pct=document.getElementById("mgPct");if(pct){pct.textContent=margin.toFixed(1)+"%";pct.style.color=t.heroH;}
  var b=document.getElementById("mgBadge");if(b){b.textContent=t.label;b.style.background=t.soft;b.style.color=t.col;}
  ["mgtP","mgtW","mgtF","mgtB"].forEach(function(id){var e=document.getElementById(id);if(e)e.style.borderColor="transparent";});
  var on=document.getElementById({P:"mgtP",W:"mgtW",F:"mgtF",B:"mgtB"}[t.k]);if(on)on.style.borderColor=t.col;
}

function scoreDSCR(d){if(d>=1.5)return 10;if(d>=1.4)return 9;if(d>=1.3)return 8;if(d>=1.2)return 7;if(d>=1.1)return 6;if(d>=1.0)return 5;if(d>=0.9)return 4;if(d>=0.8)return 2;return 0;}

function repsYearsList(){var ys={},cy=(new Date()).getFullYear();ys[cy]=1;ys[cy-1]=1;ys[cy+1]=1;ys[repsYear]=1;repsLog.forEach(function(e){if(e.date)ys[new Date(e.date).getFullYear()]=1;});return Object.keys(ys).map(Number).sort(function(a,b){return b-a;});}
function repsPropOptions(){var names=["Portfolio-wide"];(portfolios||[]).forEach(function(pf){(pf.props||[]).forEach(function(p){if(p.name&&names.indexOf(p.name)<0)names.push(p.name);});});return names;}
function repsYearMinutes(y){return repsLog.reduce(function(s,e){return s+((e.date&&new Date(e.date).getFullYear()===y)?num(e.minutes):0);},0);}
function hm(min){min=Math.max(0,Math.round(min));return Math.floor(min/60)+"h "+(min%60)+"m";}
function repsBreakInner(){

function fmtSw(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=function(n){return(n<10?"0":"")+n;};return h>0?h+":"+p(m)+":"+p(ss):p(m)+":"+p(ss);}

function repsSwToggle(){
  if(!swRunning){swRunning=true;swStart=Date.now();if(swTimer)clearInterval(swTimer);swTimer=setInterval(repsSwTick,1000);repsSwTick();var b=document.getElementById("repsSwBtn");if(b)b.textContent="Stop stopwatch";}

function exportReps(){

  var rows=list.map(function(e){return [e.date,e.cat,e.property||"Portfolio-wide",e.activity||"",(num(e.minutes)/60).toFixed(2)];});

function blankProp(nm){return {id:uid(),name:nm||"New property",addr:"",type:"Duplex",purchaseDate:"",price:1200000,dpPct:DEFAULTS.dpPct,rate:DEFAULTS.rate,termYears:DEFAULTS.termYears,loanStart:"",value:1200000,balOverride:0,units:2,rent:6000,vacPct:DEFAULTS.vacPct,taxPct:DEFAULTS.taxPct,insurance:DEFAULTS.insurance,piMo:"",taxMo:"",insMo:"",hoa:0,pmPct:DEFAULTS.pmPct,pmFee:0,utilList:[],adu:"none",beds:0,baths:0,homeSqft:0,lotSqft:0,yearBuilt:0,notes:"",tenants:[],docs:[]};}
function utilTotal(p){var t=0;if(p&&p.utilList&&p.utilList.length){p.utilList.forEach(function(u){t+=num(u.cost);});return t;}return p?num(p.utilities):0;}
function pHas(v){return v!==undefined&&v!==null&&v!=="";}
function pCalc(p){
  var price=num(p.price),dp=num(p.dpPct)/100,r=num(p.rate)/100/12,n=num(p.termYears)*12,loan=price*(1-dp);
  var compPi=(loan>0&&n>0)?(r===0?loan/n:loan*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)):0;
  var piMo=pHas(p.piMo)?num(p.piMo):compPi;
  var taxMo=pHas(p.taxMo)?num(p.taxMo):(price*num(p.taxPct)/100/12);
  var insMo=pHas(p.insMo)?num(p.insMo):(num(p.insurance)/12);
  var piti=piMo+taxMo+insMo;
  var egi=num(p.rent)*12*(1-num(p.vacPct)/100);
  var mgmtMo=num(p.rent)*num(p.pmPct)/100+num(p.pmFee),util=utilTotal(p),hoa=num(p.hoa);
  var otherOpexMo=hoa+mgmtMo+util;
  var noi=egi-(taxMo+insMo+otherOpexMo)*12;
  var mcf=egi/12-piti-otherOpexMo,acf=mcf*12,ds=piMo*12;
  var cashInv=price*dp+price*(num(DEFAULTS.closingPct)/100);
  var cap=price>0?noi/price*100:0,coc=cashInv>0?acf/cashInv*100:0,dscr=ds>0?noi/ds:0;
  var made=Math.min(n,mBetween(p.loanStart||p.purchaseDate));
  var balNow=(pHas(p.balOverride)&&num(p.balOverride)>0)?num(p.balOverride):balAfter(loan,r,n,compPi,made);
  var equity=num(p.value)-balNow,paidOff=loan>0?(loan-balNow)/loan*100:0;
  return {loan:loan,pi:piMo,piti:piti,noi:noi,acf:acf,mcf:mcf,cap:cap,coc:coc,dscr:dscr,equity:equity,balNow:balNow,paidOff:paidOff,cashInv:cashInv,otherOpexMo:otherOpexMo,taxMo:taxMo,insMo:insMo,util:util,mgmtMo:mgmtMo,hoa:hoa,compPi:compPi};
}

/* 10-year projection: cumulative cash flow + loan paydown (+ assumed appreciation) — derived from the deal inputs */
function fxProjection(m){
  var d=deal||{},price=num(d.price),r=num(d.rate)/100/12,n=num(d.termYears)*12,appr=num(d.apprPct)/100,bal=m.loan,pts=[];
  for(var y=0;y<=10;y++){
    if(y>0){for(var i=0;i<12;i++){if(bal<=0)break;var iv=bal*r;bal=Math.max(0,bal-(m.pi-iv));}}
    var val=price*Math.pow(1+appr,y);pts.push({y:y,eq:(val-bal),cum:m.acf*y});}
  return pts;
}
function fxSpark(m){

function egProps(){var out=[];portfolios.forEach(function(pf){(pf.props||[]).forEach(function(p){out.push({p:p,pf:pf});});});return out;}
function egPropCalc(p){
  var c=pCalc(p),rent=num(p.rent),res=rent*num(endGame.reserve)/100;
  var paidOff=rent*(1-num(p.vacPct)/100)-c.taxMo-c.insMo-c.otherOpexMo-res;
  var n=num(p.termYears)*12,now=new Date(),py;
  if(c.loan<=0||c.balNow<=0)py=now.getFullYear();
  else{var st=p.loanStart||p.purchaseDate,d;if(st){d=new Date(st);d.setMonth(d.getMonth()+n);}else{d=new Date();d.setMonth(d.getMonth()+n);}py=Math.max(now.getFullYear(),d.getFullYear());}
  var today=py<=now.getFullYear()?paidOff:c.mcf-res;
  return{today:today,paidOff:paidOff,payYear:py,c:c};}

function egAt(year){var parts={Rentals:0};EG_TYPES.forEach(function(t){parts[t[0]]=0;});
  egIncluded().forEach(function(x){var e=egPropCalc(x.p);parts.Rentals+=(year>=e.payYear?e.paidOff:e.today);});
  endGame.incomes.forEach(function(i){var sy=num(i.start)||0;if(!sy||year>=sy)parts[i.type in parts?i.type:"Other"]+=num(i.amt);});
  var tot=0;for(var k in parts)tot+=parts[k];return{parts:parts,total:tot};}

function egTimeline(target){

function tmRankInfo(kind,i){var arr=tmArr(kind),g=tmGroup(kind,arr[i]),rank=0,total=0;
  arr.forEach(function(c,j){if(tmGroup(kind,c)===g){total++;if(j<=i)rank++;}});return{rank:rank,total:total,g:g};}
function tmWrap(kind,html,i){
  var ri=tmRankInfo(kind,i),r=ri.rank,top=r===1;
  html=html.replace(/padding:10px 0;border-top:1px solid [^";]*/,'flex:1;min-width:0');
  var badge='<div class="tm-rank'+(top?' tm-first':'')+'">'+r+'</div><div class="tm-lab">'+(top?'First call':'Backup')+'</div>';
  var rail='<div class="tm-rail"><div class="tm-handle" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</div>'+badge+
    '<div class="tm-arrows"><button class="chip tm-mv" data-tmk="'+kind+'" data-ti="'+i+'" data-dir="-1" title="Move up"'+(r===1?' disabled':'')+'>▲</button>'+
    '<button class="chip tm-mv" data-tmk="'+kind+'" data-ti="'+i+'" data-dir="1" title="Move down"'+(r===ri.total?' disabled':'')+'>▼</button></div></div>';
  return '<div class="tm-row'+(top?' tm-row-first':'')+'" data-trow="'+kind+'" data-ti="'+i+'" data-tg="'+esc(ri.g)+'">'+rail+html+'</div>';
}
var _tmA=alistCard;alistCard=function(c,i){return tmWrap("a",_tmA(c,i),i);};
var _tmC=contractorCard;contractorCard=function(c,i){return tmWrap("c",_tmC(c,i),i);};
function tmMoveTo(kind,from,to){ /* dropped item takes the target's spot */
  var arr=tmArr(kind);if(from===to)return;var it=arr.splice(from,1)[0];arr.splice(to,0,it);
  tmSave(kind);var y=window.scrollY;renderApp();window.scrollTo(0,y);}
function tmStep(kind,i,dir){var arr=tmArr(kind),g=tmGroup(kind,arr[i]),j=i+dir;
  while(j>=0&&j<arr.length&&tmGroup(kind,arr[j])!==g)j+=dir;if(j<0||j>=arr.length)return;
  var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;tmSave(kind);var y=window.scrollY;renderApp();window.scrollTo(0,y);}
function tmAttach(){
  document.querySelectorAll(".tm-mv").forEach(function(b){b.onclick=function(){tmStep(b.getAttribute("data-tmk"),+b.getAttribute("data-ti"),+b.getAttribute("data-dir"));};});
  var drag=null;
  document.querySelectorAll(".tm-row").forEach(function(row){
    var h=row.querySelector(".tm-handle");
    h.onmousedown=function(){row.setAttribute("draggable","true");};
    row.addEventListener("mouseup",function(){row.removeAttribute("draggable");});
    row.addEventListener("dragstart",function(e){drag={k:row.getAttribute("data-trow"),i:+row.getAttribute("data-ti"),g:row.getAttribute("data-tg")};row.classList.add("tm-dragging");try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","x");}catch(x){}});
    row.addEventListener("dragend",function(){row.classList.remove("tm-dragging");row.removeAttribute("draggable");document.querySelectorAll(".tm-over").forEach(function(r){r.classList.remove("tm-over");});drag=null;});
    row.addEventListener("dragover",function(e){if(!drag||drag.k!==row.getAttribute("data-trow")||drag.g!==row.getAttribute("data-tg"))return;e.preventDefault();row.classList.add("tm-over");});
    row.addEventListener("dragleave",function(){row.classList.remove("tm-over");});
    row.addEventListener("drop",function(e){if(!drag)return;e.preventDefault();var to=+row.getAttribute("data-ti");if(drag.g!==row.getAttribute("data-tg"))return;tmMoveTo(drag.k,drag.i,to);});
  });
}

function brCalc(){
  var b=brrrr,N=num;
  var constBudget=b.cbMethod==="manual"?N(b.cbManual):N(b.sqft)*N(b.cSqft);
  var projectCosts=N(b.pp)+N(b.softCosts)+constBudget,fv=N(b.fv);
  var projectPct=fv?projectCosts/fv*100:0;
  var agentFees=N(b.agentPct)/100*fv,closingCosts=N(b.closingPct)/100*fv,carry=N(b.carry);
  var spTotal=agentFees+closingCosts+carry;
  var profitNoCarry=fv-(agentFees+closingCosts)-projectCosts,marginPct=fv?profitNoCarry/fv*100:0;
  var hmDown=projectCosts*N(b.downPct)/100,loanHM=projectCosts-hmDown;
  var hmPoints=loanHM*N(b.pointsPct)/100,hmFees=loanHM*N(b.hmFeesPct)/100;
  var hmPayMo=loanHM*N(b.rateHM)/100/12,carrySubtotal=hmPayMo*N(b.carryMonths)+N(b.utilFees)*N(b.carryMonths);
  var totalDown=hmDown+hmPoints+hmFees,reserveAmt=constBudget*N(b.reservePct)/100;
  var cashOnHand=carrySubtotal+totalDown+reserveAmt;
  var arv=fv,equityAmt=arv*N(b.equityPct)/100,loanRefi=arv-equityAmt;
  var mr=N(b.rateRefi)/100/12,n=N(b.loanTerm)*12;
  var pi=(n<=0)?0:(mr===0?loanRefi/n:loanRefi*mr/(1-Math.pow(1+mr,-n)));
  var piti=pi+N(b.taxAnnual)/12+N(b.insAnnual)/12+N(b.hoa);
  var mgmtFee=N(b.rent)*N(b.mgmtPct)/100,cashFlow=N(b.rent)-mgmtFee-piti;
  var zone=marginPct<=10?{k:"PASS — TOO THIN",c:C.bad,h:RED_H}:marginPct<=15?{k:"WHOLESALE",c:C.warn,h:AMBER_H}:marginPct<=20?{k:"FIX & FLIP",c:"#60A5FA",h:"#7CB8FF"}:{k:"BUY & HOLD / BRRRR",c:C.go,h:GREEN_H};
  return{constBudget:constBudget,projectCosts:projectCosts,projectPct:projectPct,agentFees:agentFees,closingCosts:closingCosts,carry:carry,carryPct:fv?carry/fv*100:0,
    spTotal:spTotal,profitNoCarry:profitNoCarry,marginPct:marginPct,zone:zone,hmDown:hmDown,loanHM:loanHM,hmPoints:hmPoints,hmFees:hmFees,hmPayMo:hmPayMo,
    carrySubtotal:carrySubtotal,totalDown:totalDown,reserveAmt:reserveAmt,cashOnHand:cashOnHand,arv:arv,equityAmt:equityAmt,loanRefi:loanRefi,pi:pi,piti:piti,mgmtFee:mgmtFee,cashFlow:cashFlow};

function nrgDim(hex){ /* darker companion colour for the gradient tail */
  var h=hex.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  var f=function(v){return Math.round(v*0.32).toString(16).padStart(2,"0");};
  return "#"+f(r)+f(g)+f(b);
}
var _mgRecalc=recomputeMargin;
recomputeMargin=function(){
  _mgRecalc.apply(this,arguments);
  var m=marginData,allIn=num(m.pur)+num(m.reh)+num(m.clo)+num(m.hol)+num(m.sel),arv=num(m.arv);
  var margin=arv>0?(arv-allIn)/arv*100:0,t=marginTier(margin);
  nrgSet("mgFill",margin/30*100,t.heroH,nrgDim(t.heroH));
  var l=document.getElementById("mgFillLab");if(l)l.textContent=margin.toFixed(1)+"%";
};

document.addEventListener('DOMContentLoaded',function(){
  loadPlatform();loadTeam();loadReps();load();initTheme();renderApp();applyLang();setupLangObserver();
  if(!_storageOk){
    var b=document.createElement('div');
    b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#9A6B12;color:#fff;font-size:12px;padding:8px 16px;text-align:center;z-index:999;font-family:sans-serif;';
    b.textContent='Storage unavailable in this browser context - deals won\'t save between sessions. Open via a URL for full functionality.';
    document.body.appendChild(b);
  }
});
